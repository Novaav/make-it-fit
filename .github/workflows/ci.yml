name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repository. No secrets, no deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Action SHAs were resolved from the GitHub API on 2026-10-16; keep them current with Dependabot or by hand.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Puzzle verification (solver must reproduce the committed puzzle data)
        run: |
          python3 verify_levels.py
          git diff --exit-code -- VERIFIED_LEVELS.json src/engine/solutions.fixture.json src/dev/explorer.fixture.json

      - name: Production build contains no dev tools
        run: npm run check:prod-clean

      - name: Install Chrome and WebKit (the Safari engine) for Playwright
        run: npx playwright install --with-deps chrome webkit

      - name: Browser tests
        run: npx playwright test

      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
